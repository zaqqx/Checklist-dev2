<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Connexion -->
  <main id="login-view" class="card login" hidden>
    <h1>Checklist</h1>
    <p class="muted">Connectez-vous pour accéder aux tâches</p>
    <form id="login-form">
      <label>Email <input type="email" id="login-email" required autofocus></label>
      <label>Mot de passe <input type="password" id="login-password" required></label>
      <p class="error" id="login-error"></p>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
  </main>

  <!-- Application -->
  <div id="app-view" class="container" hidden>
    <header class="top">
      <h1>Checklist</h1>
      <div class="actions">
        <button class="btn primary" id="new-task">Nouvelle tâche</button>
        <button class="btn" id="logout">Se déconnecter</button>
      </div>
    </header>

    <section class="card filters">
      <input type="search" id="f-search" placeholder="Rechercher…">
      <select id="f-status">
        <option value="">Tous les statuts</option>
        <option value="A_FAIRE">À faire</option>
        <option value="TERMINE">Terminé</option>
      </select>
      <select id="f-assigned"><option value="">Tous les assignés</option></select>
      <select id="f-urgency">
        <option value="">Toutes les urgences</option>
        <option value="CRITIQUE">Critique</option>
        <option value="HAUTE">Haute</option>
        <option value="MOYENNE">Moyenne</option>
        <option value="BASSE">Basse</option>
      </select>
      <select id="f-due">
        <option value="">Toutes les échéances</option>
        <option value="overdue">En retard</option>
        <option value="without">Sans échéance</option>
      </select>
      <div class="filters-foot">
        <span id="count" class="muted"></span>
        <button class="link" id="reset">Réinitialiser</button>
      </div>
    </section>

    <p class="error" id="list-error"></p>
    <ul id="tasks" class="tasks"></ul>
  </div>

  <!-- Formulaire tâche -->
  <dialog id="task-dialog">
    <form id="task-form">
      <h2 id="dialog-title">Nouvelle tâche</h2>
      <label>Code CAB <input type="text" id="t-cabCode" maxlength="100" placeholder="L4S000032"></label>
      <label>Lien CAB <input type="url" id="t-cabLink" placeholder="https://..."></label>
      <label>Lien du site <input type="url" id="t-siteUrl" placeholder="https://example.com"></label>
      <label>Description <textarea id="t-description" rows="3" maxlength="2000"></textarea></label>
      <label>Urgence
        <select id="t-urgency">
          <option value="BASSE">Basse</option>
          <option value="MOYENNE" selected>Moyenne</option>
          <option value="HAUTE">Haute</option>
          <option value="CRITIQUE">Critique</option>
        </select>
      </label>
      <label>Deadline <input type="date" id="t-deadline"></label>
      <label>Assigné à
        <select id="t-assignedTo"><option value="">— Non assigné —</option></select>
      </label>
      <div class="row">
        <input type="text" id="new-dev" maxlength="100" placeholder="Nouveau dev">
        <button type="button" class="btn" id="add-dev">Ajouter</button>
      </div>
      <p class="error" id="form-error"></p>
      <div class="row end">
        <button type="button" class="btn" id="cancel">Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
